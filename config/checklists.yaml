# Which items are required for each QR mode, and how to recognize each
# item by colour. Fill in real values tonight against your actual objects.
#
# HOW TO GET hsv_low / hsv_high FOR YOUR OBJECTS:
#   Run tools/color_picker.py, point your webcam at the object, and click
#   on it. It prints an HSV range you can paste in directly below.

modes:
  mode_1:
    - red_block
    - blue_block
  mode_2:
    - red_block
    - screw_pack

# min_area is in pixels — how big the colour blob must be to count as
# "found". Raise it if the background triggers false positives; lower it
# if a real item far from the camera isn't being detected.
item_colors:
  red_block:
    hsv_low: [0, 120, 70]
    hsv_high: [10, 255, 255]
    min_area: 800
  blue_block:
    hsv_low: [100, 120, 70]
    hsv_high: [130, 255, 255]
    min_area: 800
  screw_pack:
    hsv_low: [20, 100, 100]
    hsv_high: [35, 255, 255]
    min_area: 500
