# Which items are required for each QR mode, and how to recognize each
# item with YOLOv8. Fill in real values against your actual objects.
#
# HOW TO GET A WORKING MODEL:
#   Run tools/capture_training_images.py to collect photos of each item,
#   label them (Roboflow or LabelImg) using the SAME class names as
#   item_classes below, then train — see the comment at the top of
#   kitting_logic/vision_logic.py for the exact steps.
#
#   red_block/blue_block can start from a public dataset instead of
#   capturing your own: universe.roboflow.com/autonomous-object-picking-robot/colored-blocks
#   (CC BY 4.0, classes: red/green/blue — drop "green", cite it if you use
#   it). matchbox has no public dataset — capture and label that one
#   yourself. See the README's "Training the YOLOv8 model" section.

modes:
  mode_1:
    - red_block
    - blue_block
  mode_2:
    - red_block
    - matchbox

yolo:
  # Path is relative to the project root. Not committed to git (it's a
  # trained artifact, not source) — train your own and drop it here.
  weights: models/best.pt

# confidence is how sure the model must be (0.0-1.0) to count an item as
# "found". Lower it if a real item isn't being detected; raise it if the
# model is confidently wrong about something else being this item.
item_classes:
  # class_name is whatever the model's own class is called — it doesn't
  # have to match the item name on the left. red_block/blue_block point at
  # "red"/"blue" (the public colored-blocks dataset's own class names, see
  # above) so you don't have to relabel its 513 images just to rename them.
  red_block:
    class_name: red
    confidence: 0.5
  blue_block:
    class_name: blue
    confidence: 0.5
  matchbox:
    class_name: matchbox
    confidence: 0.5
