# Which items are required for each QR mode, and how to recognize each
# item with YOLOv8. Fill in real values against your actual objects.
#
# HOW TO GET A WORKING MODEL:
#   Run tools/capture_training_images.py to collect photos of each item,
#   label them (Roboflow or LabelImg) using the SAME class names as
#   item_classes below, then train — see the comment at the top of
#   kitting_logic/vision_logic.py for the exact steps.

modes:
  mode_1:
    - red_block
    - blue_block
  mode_2:
    - red_block
    - matchbox

yolo:
  # Path is relative to the project root. Not committed to git (it's a
  # trained artifact, not source) — train your own and drop it here.
  weights: models/best.pt

# confidence is how sure the model must be (0.0-1.0) to count an item as
# "found". Lower it if a real item isn't being detected; raise it if the
# model is confidently wrong about something else being this item.
item_classes:
  red_block:
    class_name: red_block
    confidence: 0.5
  blue_block:
    class_name: blue_block
    confidence: 0.5
  matchbox:
    class_name: matchbox
    confidence: 0.5
