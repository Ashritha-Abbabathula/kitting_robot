# Copy this file to secrets.yaml (NOT committed to git — see .gitignore)
# and fill in your real Twilio sandbox details.
#
# Get these from: https://console.twilio.com -> Messaging -> Try it out -> Send a WhatsApp message
# account_sid and auth_token are on your Twilio Console dashboard.
# from_whatsapp is always the Twilio sandbox number shown there.
# to_whatsapp is YOUR phone number, in the same format, after you've sent
# "join <your-sandbox-code>" to that sandbox number from your own WhatsApp.

twilio:
  account_sid: "ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  auth_token: "your_auth_token_here"
  from_whatsapp: "whatsapp:+14155238886"
  to_whatsapp: "whatsapp:+91XXXXXXXXXX"
