# Copy this file to secrets.yaml (NOT committed to git — see .gitignore)
# and fill in your real Twilio details.
#
# account_sid and auth_token: on your Twilio Console home page
# (console.twilio.com) — auth_token is behind the "API keys and Auth
# tokens" link.
#
# USING SMS (no sandbox, no upgrade needed — works on a free trial):
#   from_whatsapp: your Twilio trial phone number, e.g. "+15551234567"
#     (Console home page, or Phone Numbers -> Manage -> Active Numbers)
#   to_whatsapp: YOUR OWN phone number, e.g. "+91XXXXXXXXXX"
#     (must be the number you verified when creating your Twilio trial —
#     trial accounts can only text verified numbers)
#   Note: trial-account SMS messages arrive with a
#   "Sent from your Twilio trial account - " prefix added automatically.
#   That's normal, not a bug.
#
# USING WHATSAPP instead (needs the free Sandbox, not an upgrade):
#   from_whatsapp: "whatsapp:+14155238886"   (Twilio's sandbox number)
#   to_whatsapp: "whatsapp:+91XXXXXXXXXX"    (your number, after texting
#     "join <your-sandbox-code>" to that sandbox number from your phone)
#
# The field names say "whatsapp" but the code just hands these straight
# to Twilio — leave off the "whatsapp:" prefix and it sends a plain SMS
# instead. No code changes needed either way.

twilio:
  account_sid: "ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  auth_token: "your_auth_token_here"
  from_whatsapp: "+15551234567"
  to_whatsapp: "+91XXXXXXXXXX"
